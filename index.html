<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMS Helper UA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #345d83;
            --text-color: #ffffff;
            --accent-color: #8bbce7;
            --secondary-bg: #111111;
            --input-bg: #1a1a1a;
            --success-color: #5eba62;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
            text-align: center;
        }

        /* МЕНЮ */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .menu-item {
            background-color: var(--card-bg);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .menu-item:active { transform: scale(0.96); }

        .menu-item i { font-size: 32px; margin-bottom: 10px; }

        .menu-item span {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .full-width {
            grid-column: span 2;
            background-color: #1c2735;
            flex-direction: row;
            padding: 15px;
        }

        .full-width i { margin-bottom: 0; margin-right: 15px; }

        /* СТОРІНКИ */
        .page { display: none; width: 100%; max-width: 500px; }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            padding: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .back-btn i { margin-right: 10px; }

        /* ТАБЛИЦІ ТА ІНПУТИ */
        .table-container {
            background: var(--secondary-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { color: #777; text-align: left; padding: 10px; font-size: 11px; border-bottom: 1px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background: var(--input-bg);
            color: white;
            box-sizing: border-box;
        }

        .bolus-val { color: var(--success-color); font-weight: bold; }
        .unit-small { font-size: 9px; color: #666; display: block; }
    </style>
</head>
<body>

    <!-- ГОЛОВНЕ МЕНЮ -->
    <div id="main-menu">
        <div class="header">EMShelper</div>
        <div class="grid-container">
            <div class="menu-item" onclick="openPage('protocols')"><i class="fas fa-file-medical"></i><span>Протоколи</span></div>
            <div class="menu-item" onclick="openPage('calc')"><i class="fas fa-calculator"></i><span>Калькулятор</span></div>
            <div class="menu-item" onclick="openPage('dosage')"><i class="fas fa-hand-holding-medical"></i><span>Дозування</span></div>
            <div class="menu-item" onclick="openPage('coding')"><i class="fas fa-star-of-life"></i><span>Кодування</span></div>
            <div class="menu-item" onclick="openPage('pediatrics')"><i class="fas fa-child"></i><span>Педіатрія</span></div>
            <div class="menu-item" onclick="openPage('scales')"><i class="fas fa-balance-scale"></i><span>Шкали</span></div>
            <div class="menu-item full-width" onclick="openPage('examples')"><i class="fas fa-clipboard-list"></i><span>Приклади карт виїзду</span></div>
        </div>
    </div>

    <!-- КАЛЬКУЛЯТОР ДОЗ -->
    <div id="calc" class="page">
        <button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button>
        <div style="background: var(--input-bg); padding: 15px; border-radius: 12px; margin: 10px 0; border: 1px solid var(--card-bg);">
            <label style="color: var(--accent-color); font-size: 14px;">Вага пацієнта (кг):</label>
            <input type="number" id="patientWeight" placeholder="0" oninput="calculateAll()" style="font-size: 28px; text-align: center; color: var(--success-color); margin-top: 5px;">
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Препарат</th><th>Болюс</th><th>Інфузія/год</th></tr></thead>
                <tbody id="calc-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- КОМПАКТНЕ ДОЗУВАННЯ -->
    <div id="dosage" class="page">
        <button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button>
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
            <h2 style="color: var(--accent-color); margin: 0;">Дози</h2>
            <input type="text" id="doseSearch" placeholder="Пошук..." onkeyup="searchDose()" style="width: 50%; padding: 8px;">
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Препарат</th><th>Bolus</th><th>Min-Max</th></tr></thead>
                <tbody id="dosage-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- ЗАГЛУШКИ -->
    <div id="protocols" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Протоколи</h2></div>
    <div id="coding" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Кодування</h2></div>
    <div id="pediatrics" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Педіатрія</h2></div>
    <div id="scales" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Шкали</h2></div>
    <div id="examples" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Карти виїзду</h2></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const dosageData = [
            { name: "Добутамін", bMin: 0, bMax: 0, bUnit: "", iMin: 2.0, iMax: 20.0, iUnit: "мкг/кг/хв" },
            { name: "Рокуроній", bMin: 0.6, bMax: 1.2, bUnit: "мг", iMin: 0, iMax: 0, iUnit: "" },
            { name: "Адреналін", bMin: 0, bMax: 0, bUnit: "", iMin: 0.01, iMax: 0.5, iUnit: "мкг/кг/хв" },
            { name: "Пропофол", bMin: 1.5, bMax: 2.5, bUnit: "мг", iMin: 0.3, iMax: 6.0, iUnit: "мг/кг/год" },
            { name: "Кетамін", bMin: 1, bMax: 2, bUnit: "мг", iMin: 0.1, iMax: 0.3, iUnit: "мг/кг/год" },
            { name: "Тіопентал", bMin: 3, bMax: 7, bUnit: "мг", iMin: 0.5, iMax: 7.0, iUnit: "мг/кг/год" },
            { name: "Норадреналін", bMin: 0, bMax: 0, bUnit: "", iMin: 0.05, iMax: 1.0, iUnit: "мкг/кг/хв" },
            { name: "Фентаніл", bMin: 1, bMax: 3, bUnit: "мкг", iMin: 1.0, iMax: 5.0, iUnit: "мкг/кг/год" },
            { name: "Морфін", bMin: 0.05, bMax: 0.1, bUnit: "мг", iMin: 0, iMax: 0, iUnit: "" },
            { name: "Мідазолам", bMin: 0.02, bMax: 0.1, bUnit: "мг", iMin: 0.03, iMax: 0.2, iUnit: "мг/кг/год" },
            { name: "Дексдор", bMin: 0.5, bMax: 1, bUnit: "мкг", iMin: 0.2, iMax: 1.4, iUnit: "мкг/кг/год" }
        ];

        function renderDosageTable(data = dosageData) {
            const tbody = document.getElementById('dosage-table-body');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td style="font-weight:bold;">${item.name}</td>
                    <td class="bolus-val">${item.bMin > 0 ? `${item.bMin}-${item.bMax} ${item.bUnit}/кг` : "-"}</td>
                    <td>${item.iMin > 0 ? `${item.iMin}-${item.iMax} <span class="unit-small">${item.iUnit}</span>` : "-"}</td>
                </tr>
            `).join('');
        }

        function calculateAll() {
            const weight = parseFloat(document.getElementById('patientWeight').value) || 0;
            const tbody = document.getElementById('calc-table-body');
            if (weight <= 0) { tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:15px;">Введіть вагу</td></tr>'; return; }
            
            tbody.innerHTML = dosageData.map(item => `
                <tr>
                    <td style="font-weight:bold;">${item.name}</td>
                    <td class="bolus-val">${item.bMin > 0 ? `${(item.bMin * weight).toFixed(1)}-${(item.bMax * weight).toFixed(1)} ${item.bUnit}` : "-"}</td>
                    <td>${item.iMin > 0 ? `${(item.iMin * weight).toFixed(1)}-${(item.iMax * weight).toFixed(1)} <span class="unit-small">${item.iUnit.split('/')[0]}/год</span>` : "-"}</td>
                </tr>
            `).join('');
        }

        function searchDose() {
            const query = document.getElementById('doseSearch').value.toLowerCase();
            renderDosageTable(dosageData.filter(d => d.name.toLowerCase().includes(query)));
        }

        function openPage(pageId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
        }

        function showMenu() {
            document.getElementById('main-menu').style.display = 'block';
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        }

        renderDosageTable();
    </script>
</body>
</html>
