<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMS Helper UA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #345d83;
            --text-color: #ffffff;
            --accent-color: #8bbce7;
            --secondary-bg: #111111;
            --input-bg: #1a1a1a;
            --success-color: #5eba62;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 20px 0;
            text-align: center;
        }

        /* МЕНЮ */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 450px;
        }

        .menu-item {
            background-color: var(--card-bg);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .menu-item:active { transform: scale(0.96); }
        .menu-item i { font-size: 32px; margin-bottom: 10px; }
        .menu-item span { font-size: 13px; font-weight: bold; text-transform: uppercase; }

        .full-width {
            grid-column: span 2;
            background-color: #1c2735;
            flex-direction: row;
            padding: 15px;
        }

        .full-width i { margin-bottom: 0; margin-right: 15px; }

        /* СТОРІНКИ */
        .page { display: none; width: 100%; max-width: 500px; }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            padding: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .back-btn i { margin-right: 10px; }

        /* КАЛЬКУЛЯТОР ТА ТАБЛИЦІ */
        .calc-box {
            background: var(--input-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--card-bg);
            margin-bottom: 15px;
        }

        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #777; margin-bottom: 4px; }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #000;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        .result-display {
            background: #000;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 2px dashed var(--success-color);
            margin-top: 10px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        th { color: #777; text-align: left; padding: 10px; font-size: 11px; border-bottom: 1px solid #333; }
        td { padding: 10px; border-bottom: 1px solid #222; }
        .bolus-val { color: var(--success-color); font-weight: bold; }
    </style>
</head>
<body>

    <!-- ГОЛОВНЕ МЕНЮ -->
    <div id="main-menu">
        <div class="header">EMShelper</div>
        <div class="grid-container">
            <div class="menu-item" onclick="openPage('protocols')"><i class="fas fa-file-medical"></i><span>Протоколи</span></div>
            <div class="menu-item" onclick="openPage('calc')"><i class="fas fa-calculator"></i><span>Калькулятор</span></div>
            <div class="menu-item" onclick="openPage('dosage')"><i class="fas fa-hand-holding-medical"></i><span>Дозування</span></div>
            <div class="menu-item" onclick="openPage('coding')"><i class="fas fa-star-of-life"></i><span>Кодування</span></div>
            <div class="menu-item" onclick="openPage('pediatrics')"><i class="fas fa-child"></i><span>Педіатрія</span></div>
            <div class="menu-item" onclick="openPage('scales')"><i class="fas fa-balance-scale"></i><span>Шкали</span></div>
            <div class="menu-item full-width" onclick="openPage('examples')"><i class="fas fa-clipboard-list"></i><span>Приклади карт виїзду</span></div>
        </div>
    </div>

    <!-- УНІВЕРСАЛЬНИЙ КАЛЬКУЛЯТОР -->
    <div id="calc" class="page">
        <button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button>
        <div class="calc-box">
            <div class="input-group">
                <label>Вага пацієнта (кг)</label>
                <input type="number" id="p_weight" value="80" oninput="runCalc()" style="color: var(--success-color); font-size: 22px; font-weight: bold;">
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>Препарату в шприці</label>
                    <input type="number" id="p_amount" value="50" oninput="runCalc()">
                </div>
                <div style="flex: 1;">
                    <label>Одн.</label>
                    <select id="p_unit" onchange="runCalc()">
                        <option value="mg">мг</option>
                        <option value="mcg">мкг</option>
                    </select>
                </div>
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label>Об'єм розчину (мл)</label>
                <input type="number" id="p_volume" value="50" oninput="runCalc()">
            </div>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label>Доза (на кг/хв)</label>
                    <input type="number" id="p_dose" value="5" oninput="runCalc()" style="border-color: var(--accent-color);">
                </div>
                <div style="flex: 1;">
                    <label>Одн.</label>
                    <select id="d_unit" onchange="runCalc()">
                        <option value="mcg">мкг</option>
                        <option value="mg">мг</option>
                    </select>
                </div>
            </div>
            <div class="result-display">
                <div style="color: #777; font-size: 13px; margin-bottom: 5px;">Швидкість інфузії:</div>
                <div id="calc_result" style="font-size: 38px; font-weight: bold; color: var(--success-color);">0.00</div>
                <div style="color: var(--success-color); font-size: 16px; font-weight: bold;">мл/год</div>
            </div>
        </div>
    </div>

    <!-- ДОЗУВАННЯ (ДОВІДНИК) -->
    <div id="dosage" class="page">
        <button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button>
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 10px 0;">
            <h2 style="color: var(--accent-color); margin: 0;">Дози</h2>
            <input type="text" id="doseSearch" placeholder="Пошук..." onkeyup="searchDose()" style="width: 50%; padding: 8px;">
        </div>
        <table>
            <thead><tr><th>Препарат</th><th>Bolus</th><th>Min-Max</th></tr></thead>
            <tbody id="dosage-table-body"></tbody>
        </table>
    </div>

    <!-- ІНШІ СТОРІНКИ -->
    <div id="protocols" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Протоколи</h2></div>
    <div id="coding" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Кодування</h2></div>
    <div id="pediatrics" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Педіатрія</h2></div>
    <div id="scales" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Шкали</h2></div>
    <div id="examples" class="page"><button class="back-btn" onclick="showMenu()"><i class="fas fa-arrow-left"></i> Назад</button><h2>Карти виїзду</h2></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

const dosageData = [
    { name: "Добутамін", bMin: 0, bMax: 0, bUnit: "", iMin: 2.0, iMax: 20.0, iUnit: "мкг/кг/хв" },
    { name: "Рокуроній", bMin: 0.6, bMax: 1.2, bUnit: "мг/кг", iMin: 0, iMax: 0, iUnit: "" },
    { name: "Адреналін", bMin: 0, bMax: 0, bUnit: "", iMin: 0.01, iMax: 0.5, iUnit: "мкг/кг/хв" },
    { name: "Пропофол", bMin: 1.5, bMax: 2.5, bUnit: "мг", iMin: 0.3, iMax: 6.0, iUnit: "мг/кг/год" },
    { name: "Мідазолам", bMin: 0.02, bMax: 0.1, bUnit: "мг", iMin: 0.03, iMax: 0.2, iUnit: "мг/кг/год" },
    { name: "Дексдор", bMin: 0.5, bMax: 1, bUnit: "мкг", iMin: 0.2, iMax: 1.4, iUnit: "мкг/кг/год" },
    { name: "Кетамін", bMin: 1, bMax: 2, bUnit: "мг/кг", iMin: 0.1, iMax: 0.3, iUnit: "мг/кг/год" },
    { name: "Тіопентал", bMin: 3, bMax: 7, bUnit: "мг/кг", iMin: 0.5, iMax: 7.0, iUnit: "мг/кг/год" },
    { name: "Норадреналін", bMin: 0, bMax: 0, bUnit: "", iMin: 0.05, iMax: 1.0, iUnit: "мкг/кг/год" },
    { name: "Фентаніл", bMin: 1, bMax: 3, bUnit: "мкг/кг", iMin: 1.0, iMax: 5.0, iUnit: "мкг/кг/год" },
    { name: "Морфін", bMin: 0.05, bMax: 0.1, bUnit: "мг/кг", iMin: 0, iMax: 0, iUnit: "" },
    { name: "ГОМК", bMin: 50, bMax: 100, bUnit: "мг/кг", iMin: 0, iMax: 0, iUnit: "" }
];

        function runCalc() {
            const weight = parseFloat(document.getElementById('p_weight').value) || 0;
            const amount = parseFloat(document.getElementById('p_amount').value) || 0;
            const volume = parseFloat(document.getElementById('p_volume').value) || 1;
            const dose = parseFloat(document.getElementById('p_dose').value) || 0;
            
            const amountUnit = document.getElementById('p_unit').value;
            const doseUnit = document.getElementById('d_unit').value;

            if (weight > 0 && amount > 0) {
                let totalMcg = (amountUnit === 'mg') ? amount * 1000 : amount;
                let targetMcgMin = (doseUnit === 'mg') ? (dose * 1000) * weight : dose * weight;
                let mcgPerMl = totalMcg / volume;
                let mlPerHour = (targetMcgMin * 60) / mcgPerMl;
                document.getElementById('calc_result').innerText = mlPerHour.toFixed(2);
            } else {
                document.getElementById('calc_result').innerText = "0.00";
            }
        }

        function renderDosageTable(data = dosageData) {
            const tbody = document.getElementById('dosage-table-body');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td style="font-weight:bold;">${item.name}</td>
                    <td class="bolus-val">${item.bMin > 0 ? `${item.bMin}-${item.bMax} ${item.bUnit}` : "-"}</td>
                    <td>${item.iMin > 0 ? `${item.iMin}-${item.iMax} <small style="color:#666;">${item.iUnit}</small>` : "-"}</td>
                </tr>
            `).join('');
        }

        function searchDose() {
            const query = document.getElementById('doseSearch').value.toLowerCase();
            renderDosageTable(dosageData.filter(d => d.name.toLowerCase().includes(query)));
        }

        function openPage(pageId) {
            document.getElementById('main-menu').style.display = 'none';
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(pageId).style.display = 'block';
            if(pageId === 'calc') runCalc();
        }

        function showMenu() {
            document.getElementById('main-menu').style.display = 'block';
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        }

        renderDosageTable();
    </script>
</body>
</html>
